<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- App Container -->
    <div id="app" class="h-full flex flex-col justify-between">
        <!-- Main Content Render Area -->
    </div>

    <!-- Application Script -->
    <script>
        // -------------------------------------------------------------
        // 1. EXTENDED QUESTION POOL & GENERATOR (대규모 문제 풀 및 생성)
        // -------------------------------------------------------------
        const baseQuestionPool = [
            // 과목 1: 목재 재료학 및 공구
            { subject: "목재 재료학 및 공구", q: "목재의 함수율을 구하는 공식으로 올바른 것은? (W1: 건조 전 중량, W0: 전건 중량)", opts: ["[(W1 - W0) / W0] × 100", "[(W0 - W1) / W1] × 100", "[(W1 + W0) / W0] × 100", "[(W1 - W0) / W1] × 100"], ans: 1, exp: "함수율(%) = [(건조 전 중량 - 전건 중량) / 전건 중량] × 100 입니다." },
            { subject: "목재 재료학 및 공구", q: "목재의 수축률이 가장 큰 방향부터 작은 방향으로 올바르게 나열된 것은?", opts: ["접선 방향 > 반경 방향 > 섬유 방향", "섬유 방향 > 반경 방향 > 접선 방향", "반경 방향 > 접선 방향 > 섬유 방향", "접선 방향 > 섬유 방향 > 반경 방향"], ans: 1, exp: "수축 변형률은 접선(수피)방향 > 반경(나이테)방향 > 섬유(길이)방향 순입니다." },
            { subject: "목재 재료학 및 공구", q: "다음 중 활엽수(하드우드)에 해당하며 고급 가구 및 공예재로 많이 쓰이는 수종은?", opts: ["호두나무(Walnut)", "소나무(Pine)", "삼나무(Cedar)", "전나무(Fir)"], ans: 1, exp: "월넛(호두나무), 참나무, 느티나무 등은 대표적인 활엽수(하드우드)입니다." },
            { subject: "목재 재료학 및 공구", q: "목재 건조의 주요 목적으로 옳지 않은 것은?", opts: ["목재 부피의 무한 확장", "목재의 수축 팽창 변형 예방", "부패균 및 병충해 방지", "운반 중량 감소 및 강도 증가"], ans: 1, exp: "목재 건조는 변형 예방, 썩음 방지, 강도 향상, 운반성 향상이 목적입니다." },
            { subject: "목재 재료학 및 공구", q: "목재의 변재와 심재에 관한 설명으로 옳은 것은?", opts: ["심재는 나이테 안쪽 죽은 세포층으로 내구성이 높고 색이 진하다", "변재가 심재보다 썩지 않으며 벌레 피해에 강하다", "변재는 수분 함량이 심재보다 훨씬 낮다", "심재는 나무 껍질 바로 밑 부분이다"], ans: 1, exp: "심재는 수지가 축적되어 어두운 색을 띠고 내구성 및 방충성이 뛰어납니다." },
            { subject: "목재 재료학 및 공구", q: "목재 건조 결함 중 겉은 마르고 속은 마르지 않아 잔류 응력이 생기는 현상은?", opts: ["겉마름(Case Hardening)", "꿀벌집 쪼개짐(Honeycomb)", "비틀림(Twist)", "표면 잔금"], ans: 1, exp: "겉마름은 표면 수분이 급격히 먼저 증발하여 발생하는 건조 결함입니다." },
            { subject: "목재 재료학 및 공구", q: "손대패 바닥의 평면 상태를 점검하기 위해 2개를 올려놓고 측정하는 도구는?", opts: ["하대기(평면기)", "버니어 캘리퍼스", "피치 게이지", "다이얼 게이지"], ans: 1, exp: "대패 바닥의 평면도 점검에는 2개의 하대기(평판게이지)를 사용합니다." },
            { subject: "목재 재료학 및 공구", q: "합성 판재 중 목재 섬유(Fiber)를 고온 고압으로 바이오 접착제와 섞어 성형한 판재는?", opts: ["MDF(중밀도 섬유판)", "합판(Plywood)", "파티클보드(PB)", "집성목"], ans: 1, exp: "MDF는 목재 섬유(파이버)를 압축 성형하여 입자가 매우 고른 판재입니다." },
            { subject: "목재 재료학 및 공구", q: "목재의 비중(Specific Gravity)이 클 때 나타나는 일반적 특징은?", opts: ["휨 강도와 압축 강도가 크다", "목재가 매우 가벼워진다", "수축 팽창 변형량이 매우 적다", "건조 속도가 현저히 빨라진다"], ans: 1, exp: "비중이 큰 목재일수록 강도가 높고 수축 및 팽창 변형량도 더 큽니다." },
            { subject: "목재 재료학 및 공구", q: "샌딩 사포(Sandpaper) 번호(#)에 대한 설명으로 바른 것은?", opts: ["숫자가 클수록 입자가 고와 마감용에 적합하다", "#80이 #400보다 입자가 고르다", "사포질은 고운 번호에서 거친 번호 순으로 한다", "사포질은 나뭇결 직각 방향으로 강하게 연삭한다"], ans: 1, exp: "사포 번호(#)는 숫자가 클수록 입자가 가늘고 고운 연마지입니다." },
            { subject: "목재 재료학 및 공구", q: "테이블 톱 켜기(섬유 방향 절단) 시 목재가 튀어 오르는 반동(Kickback)을 막는 안전 장치는?", opts: ["쪼개짐 방지 날(Riving Knife)", "벨트 샌더", "스핀들 락", "루터 가이드"], ans: 1, exp: "분할날(Riving knife)은 목재 절단 부위가 좁아지며 톱날을 찝는 반동을 방지합니다." },
            { subject: "목재 재료학 및 공구", q: "목재의 생나무가 마를 때 소멸하는 수분의 순서는?", opts: ["자유수가 먼저 증발한 후 결합수가 빠져나간다", "결합수가 먼저 증발한 후 자유수가 빠져나간다", "자유수와 결합수가 동시에 소멸한다", "결합수만 증발하고 자유수는 남는다"], ans: 1, exp: "목재 건조 시 세포 간극의 자유수가 먼저 빠져나가고 섬유포화점 이하에서 결합수가 빠져나갑니다." },

            // 과목 2: 목공예 및 가구 제작 작업
            { subject: "목공예 작업", q: "서랍 앞판과 옆판 결합처럼 당기는 인장력이 많이 작용하는 모서리에 쓰는 장부는?", opts: ["주먹장 맞춤(Dovetail Joint)", "연귀 맞춤", "맞대기 맞춤", "민장부 맞춤"], ans: 1, exp: "주먹장(도브테일) 맞춤은 부채꼴 쐐기 구조로 인장 결합력이 매우 뛰어납니다." },
            { subject: "목공예 작업", q: "90도 모서리에서 나무 나이테 결을 감추기 위해 45도로 절단하여 결합하는 맞춤은?", opts: ["연귀 맞춤(Miter Joint)", "장부 맞춤", "반턱 맞춤", "촉 맞춤"], ans: 1, exp: "연귀 맞춤은 45도 각도로 맞물려 모서리 외관을 깔끔하게 마감합니다." },
            { subject: "목공예 작업", q: "암장부(Mortise) 구멍을 사각형 형태로 정밀하게 파내는 목공 기계는?", opts: ["각장부기(Mortiser)", "띠톱기계(Band Saw)", "두께 대패기", "만능 목공기"], ans: 1, exp: "각장부기는 드릴과 사각 칼날이 통합되어 사각 암장부 구멍을 만듭니다." },
            { subject: "목공예 작업", q: "목공예 및 가구 도장 시 락 깍지벌레 분비물을 알코올에 녹여 만드는 천연 도료는?", opts: ["셀락(Shellac)", "카슈 도료", "우레탄 니스", "에나멜 칠"], ans: 1, exp: "셀락은 천연 곤충 분비물을 알코올에 녹여 사용하는 투명 친환경 도료입니다." },
            { subject: "목공예 작업", q: "전동 루터(Router) 작업 시 부재 모서리를 따라 굴러가며 깊이를 유지하는 비트 부품은?", opts: ["가이드 베어링", "콜렛 척", "스핀들 락", "조임 렌치"], ans: 1, exp: "가이드 베어링은 비트 하단에서 목재 단면을 타며 일정한 모따기를 돕습니다." },
            { subject: "목공예 작업", q: "목선반(Wood Lathe) 회전 기계 작업 시 가장 중요한 안전 수칙은?", opts: ["작업 중 장갑 착용을 금지하고 소매를 단정히 한다", "손 보호를 위해 두꺼운 면장갑을 착용한다", "작업 중 칼받이 위치를 실시간 조정한다", "회전 속도를 항상 최고속으로 가동한다"], ans: 1, exp: "회전 기계 작업 시 장갑 착용은 말려 들어갈 위험이 있어 엄격히 금지됩니다." },
            { subject: "목공예 작업", q: "목재 표면에 가열된 펜이나 불도장으로 도안을 태워 그리는 공예 기법은?", opts: ["우드버닝(Woodburning)", "상감 기법", "칠보 공예", "캐스팅"], ans: 1, exp: "우드버닝(낙화)은 열을 이용해 목재 표면에 그림이나 문양을 태워 장식합니다." },
            { subject: "목공예 작업", q: "목재 조각 시 오목한 곡면 홈이나 보울(Bowl) 내부를 파내는 데 쓰는 조각 칼은?", opts: ["둥근칼(Gouge)", "평칼", "창칼", "삼각칼"], ans: 1, exp: "둥근칼(아사도)은 곡면 홈을 파내는 데 최적화된 조각칼입니다." },
            { subject: "목공예 작업", q: "목재 클램핑 작업 시 과도한 압력으로 접착제가 밀려나 접착력이 떨어지는 결함은?", opts: ["Starved Joint", "수축 결함", "무늬목 뒤틀림", "도막 백화"], ans: 1, exp: "과도한 좜은 접착제층을 밖으로 모두 밀어내어 Starved Joint 결함을 일으킵니다." },
            { subject: "목공예 작업", q: "전통 옻칠 도장 시 옻 수액의 핵심 유성 화학 성분은?", opts: ["우루시올(Urushiol)", "포름알데히드", "톨루엔", "아세톤"], ans: 1, exp: "옻칠의 고유 도막을 형성하는 유용한 천연 성분은 우루시올입니다." },
            { subject: "목공예 작업", q: "목재 조립 시 나사못을 직결할 때 나무 쪼개짐을 방지하기 위해 먼저 뚫는 구멍은?", opts: ["유도 구멍(Pilot Hole)", "암장부 구멍", "반턱 구멍", "배수 구멍"], ans: 1, exp: "유도 구멍(파일럿 홀)을 예비로 뚫어주어야 나사못으로 인한 쪼개짐을 막습니다." },
            { subject: "목공예 작업", q: "목재 숫장부 끝에 쐐기(Wedge)를 박아 조립하는 주된 이유는?", opts: ["장부 끝을 벌려 암장부 안에서 결합력이 이탈되지 않게 하기 위함", "무겁게 만들기 위함", "칠을 잘 받게 하기 위함", "나무 색을 바꾸기 위함"], ans: 1, exp: "숫장부에 쐐기를 박으면 암장부 내부에서 장부 끝이 벌어지며 이탈이 방지됩니다." },

            // 과목 3: 목공예 디자인 및 작업계획
            { subject: "목공예 디자인 및 작업계획", q: "도면 작성 시 물체의 보이지 않는 내부 구조나 은폐된 부분을 표시하는 선은?", opts: ["파선(은선)", "굵은 실선", "1점 쇄선", "2점 쇄선"], ans: 1, exp: "보이지 않는 모서리나 구조는 점선 형태의 파선(은선)으로 표기합니다." },
            { subject: "목공예 디자인 및 작업계획", q: "KS 제도 규격에서 도면에 치수를 기입할 때 단위 표시가 없으면 기준 단위는?", opts: ["mm", "cm", "m", "inch"], ans: 1, exp: "한국산업표준 제도 통칙상 도면 단위는 mm가 기본입니다." },
            { subject: "목공예 디자인 및 작업계획", q: "가구 조형 디자인의 황금 비율(Golden Ratio) 수치 비율은?", opts: ["1 : 1.618", "1 : 1.414", "1 : 1.732", "1 : 2.000"], ans: 1, exp: "황금 비율은 1 : 1.618 로 시각적 균형미가 뛰어납니다." },
            { subject: "목공예 디자인 및 작업계획", q: "제3각법 도면 배치에서 정면도(Front view) 바로 위에 위치하는 도면은?", opts: ["평면도", "저면도", "우측면도", "배면도"], ans: 1, exp: "제3각법에서 정면도 위쪽에는 위에서 본 평면도가 배치됩니다." },
            { subject: "목공예 디자인 및 작업계획", q: "인간공학적(Ergonomics) 가구 설계 시 최우선 고려 사항은?", opts: ["사용자 인체 치수 및 동작 편의성", "목재 원목 판재 시판 크기", "운반 차량 크기", "도료 용량"], ans: 1, exp: "인간공학 디자인은 사용자의 신체 구조와 편의성을 최우선 고려합니다." },
            { subject: "목공예 디자인 및 작업계획", q: "19세기 말 기계화 생산 반발과 수공예 장인정신 회복을 주창한 운동은?", opts: ["미술공예운동(Arts & Crafts)", "아르데코", "팝아트", "구성주의"], ans: 1, exp: "윌리엄 모리스가 이끈 미술공예운동은 수공예 정교함의 회복을 주창했습니다." },
            { subject: "목공예 디자인 및 작업계획", q: "도면 표시 기호 중 지름(Diameter)을 나타내는 기호는?", opts: ["Ø (또는 DIA)", "R", "□", "t"], ans: 1, exp: "지름은 Ø, 반지름은 R, 두께는 t 로 나타냅니다." },
            { subject: "목공예 디자인 및 작업계획", q: "실제 가구 제작 전 형태감과 결함을 검증하기 위해 만드는 시제품 모형은?", opts: ["목업(Mock-up)", "렌더링", "스케치", "투시도"], ans: 1, exp: "목업(Mock-up)은 최종 실물 제작 전 구조와 디자인을 점검하는 평가 모형입니다." },
            { subject: "목공예 디자인 및 작업계획", q: "1개의 소멸점(Vanishing Point)을 가지며 전면이 투화면과 평행한 투시도법은?", opts: ["1점 투시도", "2점 투시도", "3점 투시도", "등길이 투시도"], ans: 1, exp: "1점 투시도는 소멸점이 1개인 투시 방식으로 실내 및 전면 표현에 좋습니다." },
            { subject: "목공예 디자인 및 작업계획", q: "도면에서 물체의 중심선이나 축선을 표시하는 선은?", opts: ["1점 쇄선", "굵은 실선", "파선", "파형선"], ans: 1, exp: "중심선 및 축선은 1점 쇄선을 사용합니다." },
            { subject: "목공예 디자인 및 작업계획", q: "색의 3속성에 해당하지 않는 것은?", opts: ["조도(Illuminance)", "색상(Hue)", "명도(Value)", "채도(Chroma)"], ans: 1, exp: "색의 3속성은 색상, 명도, 채도입니다." },
            { subject: "목공예 디자인 및 작업계획", q: "조형 요소 중 위치만 가지고 있고 크기나 넓이가 없는 최소 단위는?", opts: ["점(Point)", "선(Line)", "면(Plane)", "체적"], ans: 1, exp: "점은 위치만을 가진 조형의 기본 단위입니다." }
        ];

        // -------------------------------------------------------------
        // 2. SMART RANDOM QUESTION & NON-CONSECUTIVE ANSWER GENERATOR
        // -------------------------------------------------------------
        function generateFreshExamQuestions() {
            const subjects = [
                "목재 재료학 및 공구",
                "목공예 작업",
                "목공예 디자인 및 작업계획"
            ];
            
            let generatedList = [];
            let globalId = 1;

            subjects.forEach(subj => {
                const subPool = baseQuestionPool.filter(q => q.subject.includes(subj) || subj.includes(q.subject));
                const poolShuffled = shuffleArray(subPool);

                for (let i = 0; i < 20; i++) {
                    const rawQ = poolShuffled[i % poolShuffled.length];
                    generatedList.push({
                        id: globalId++,
                        subject: subj,
                        question: rawQ.q,
                        rawOpts: [...rawQ.opts],
                        explanation: rawQ.exp
                    });
                }
            });

            generatedList = shuffleArray(generatedList);
            generatedList.forEach((q, idx) => q.id = idx + 1);

            const finalQuestions = [];
            let lastAnswer = -1;
            let consecutiveCount = 0;

            generatedList.forEach((item) => {
                let options = [...item.rawOpts];
                let correctOptText = options[0];

                options = shuffleArray(options);
                let correctIndex = options.indexOf(correctOptText) + 1;

                if (correctIndex === lastAnswer) {
                    consecutiveCount++;
                    if (consecutiveCount >= 2) {
                        while (correctIndex === lastAnswer) {
                            options = shuffleArray(options);
                            correctIndex = options.indexOf(correctOptText) + 1;
                        }
                        consecutiveCount = 1;
                    }
                } else {
                    lastAnswer = correctIndex;
                    consecutiveCount = 1;
                }

                const formattedOptions = options.map((optText, oIdx) => `${oIdx + 1}. ${optText}`);

                finalQuestions.push({
                    id: item.id,
                    subject: item.subject,
                    question: item.question,
                    options: formattedOptions,
                    answer: correctIndex,
                    explanation: item.explanation
                });
            });

            return finalQuestions;
        }

        // -------------------------------------------------------------
        // 3. STATE MANAGEMENT & EVENT CONTROLLER
        // -------------------------------------------------------------
        const state = {
            mode: 'welcome',
            questions: [],
            userAnswers: [],
            currentIndex: 0,
            examSubmitted: false,
            timeLeft: 3600,
            timerId: null,
            score: 0,
            passStatus: false,
            subjectScores: {},
            filterIncorrectOnly: false,
            isMobile: false,
            showMobileOmr: false,
            showTutorial: true,
            tutorialStep: 1
        };

        function detectDevice() {
            state.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        }

        let touchStartX = 0;
        let touchEndX = 0;

        function init() {
            detectDevice();
            window.addEventListener('resize', () => {
                const prevMobile = state.isMobile;
                detectDevice();
                if (prevMobile !== state.isMobile) render();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Control' && (state.mode === 'exam' || state.mode === 'practice')) {
                    e.preventDefault();
                    if (state.currentIndex < state.questions.length - 1) {
                        goToQuestion(state.currentIndex + 1);
                    } else if (state.currentIndex === state.questions.length - 1) {
                        confirmSubmitModal();
                    }
                }
            });

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                if (state.mode !== 'exam' && state.mode !== 'practice') return;
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            render();
        }

        function openTutorial() {
            state.showTutorial = true;
            state.tutorialStep = 1;
            render();
        }

        function closeTutorial() {
            state.showTutorial = false;
            render();
        }

        function nextTutorialStep() {
            if (state.tutorialStep < 3) {
                state.tutorialStep++;
                render();
            } else {
                closeTutorial();
            }
        }

        function prevTutorialStep() {
            if (state.tutorialStep > 1) {
                state.tutorialStep--;
                render();
            }
        }

        function handleSwipe() {
            const swipeDistance = touchEndX - touchStartX;
            if (Math.abs(swipeDistance) > 60) {
                if (swipeDistance < 0 && state.currentIndex < state.questions.length - 1) {
                    goToQuestion(state.currentIndex + 1);
                } else if (swipeDistance > 0 && state.currentIndex > 0) {
                    goToQuestion(state.currentIndex - 1);
                }
            }
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startTest(modeType) {
            state.mode = modeType;
            state.questions = generateFreshExamQuestions();
            state.userAnswers = new Array(state.questions.length).fill(null);
            state.currentIndex = 0;
            state.examSubmitted = false;
            state.timeLeft = 3600;

            if (modeType === 'exam') {
                startTimer();
            } else if (state.timerId) {
                clearInterval(state.timerId);
            }
            render();
        }

        function startTimer() {
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    updateTimerUI();
                } else {
                    clearInterval(state.timerId);
                    alert("시험 시간이 종료되었습니다! 답안이 자동 제출됩니다.");
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                const minutes = Math.floor(state.timeLeft / 60);
                const seconds = state.timeLeft % 60;
                timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                if (state.timeLeft <= 300) {
                    timerEl.classList.add('text-red-600', 'animate-pulse');
                }
            }
        }

        function selectAnswer(qIdx, optionIdx) {
            if (state.mode === 'exam' && state.examSubmitted) return;
            state.userAnswers[qIdx] = optionIdx + 1;
            render();
        }

        function goToQuestion(idx) {
            if (idx >= 0 && idx < state.questions.length) {
                state.currentIndex = idx;
                render();
            }

                        </div>
                    </div>
                </div>

            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('modal-bg');
            if (modal) modal.remove();
        }

        function submitExam() {
            closeModal();
            if (state.timerId) clearInterval(state.timerId);
            
            let correctCount = 0;
            const subjectCorrect = {
                "목공예 재료 및 공구": 0,
                "목공예 작업": 0,
                "목공예 디자인 및 작업계획": 0
            };
            const subjectTotal = {
                "목공예 재료 및 공구": 20,
                "목공예 작업": 20,
                "목공예 디자인 및 작업계획": 20
            };

            state.questions.forEach((q, idx) => {
                if (state.userAnswers[idx] === q.answer) {
                    correctCount++;
                    subjectCorrect[q.subject] = (subjectCorrect[q.subject] || 0) + 1;
                }
            });

            state.score = Math.round((correctCount / 60) * 100);
            state.passStatus = state.score >= 60;
            state.subjectScores = {
                correctCount,
                subjectCorrect,
                subjectTotal
            };

            state.mode = 'result';
            render();
        }

            const app = document.getElementById('app');

        function downloadExamReport() {
            const now = new Date();
            const dateStr = now.toLocaleString('ko-KR');
            
            let content = `====================================================\n`;
            content += `        목공예기능사 필기 CBT 시험 결과 보고서        \n`;
            content += `====================================================\n\n`;
            content += `■ 응시 일시 : ${dateStr}\n`;
            content += `■ 응시 모드 : ${state.mode === 'exam' ? '실전 모의고사' : '연습 모드'}\n`;
            content += `■ 최종 점수 : ${state.score}점 / 100점\n`;
            content += `■ 판정 결과 : ${state.passStatus ? '합격 (PASS)' : '불합격 (FAIL)'}\n`;
            content += `■ 맞힌 문항 : ${state.subjectScores.correctCount} / 60문항\n\n`;
            
            content += `----------------------------------------------------\n`;
            content += `                  과목별 상세 성적                   \n`;
            content += `----------------------------------------------------\n`;
            Object.keys(state.subjectScores.subjectTotal).forEach(subj => {
                const c = state.subjectScores.subjectCorrect[subj] || 0;
                const t = state.subjectScores.subjectTotal[subj];
                content += `- ${subj}: ${c} / ${t}문항 (${Math.round((c/t)*100)}점)\n`;
            });
            content += `\n====================================================\n`;
            content += `                 60문항 상세 오답 및 풀이             \n`;
            content += `====================================================\n\n`;

            state.questions.forEach((q, idx) => {
                const userAns = state.userAnswers[idx];
                const isCorrect = userAns === q.answer;
                content += `[문제 ${idx + 1}] (${q.subject}) - ${isCorrect ? 'O 정답' : 'X 오답'}\n`;
                content += `Q: ${q.question}\n`;
                q.options.forEach((opt, oIdx) => {
                    content += `  ${opt}\n`;
                });
                content += `* 제출 답안: ${userAns ? userAns + '번' : '미표기'}\n`;
                content += `* 정답: ${q.answer}번\n`;
                content += `* 해설: ${q.explanation}\n`;
                content += `----------------------------------------------------\n\n`;
            });

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `목공예기능사_CBT_시험결과_${now.toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

                    <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl mx-auto w-full">

                        ${displayedQuestions.map((q) => {

                            const userAns = state.userAnswers[originalIdx];
                            const isCorrect = userAns === q.answer;

                            return `

                                        <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                                            ${isCorrect ? '정답' : '오답'}
                                        </span>
                                    </div>

                                    <div class="text-slate-800 font-medium text-base">
                                        ${q.question}
                                    </div>

                                    <div class="space-y-2 pt-1">
                                        ${q.options.map((opt, oIdx) => {
                                            const optNum = oIdx + 1;
                                            const isSelectedByUser = userAns === optNum;
                                            const isTheRightAnswer = q.answer === optNum;

                                            let style = "bg-slate-50 border-slate-200 text-slate-600";
                                            if (isTheRightAnswer) {
                                                style = "bg-emerald-50 border-emerald-400 text-emerald-900 font-semibold";
                                            } else if (isSelectedByUser && !isCorrect) {
                                                style = "bg-red-50 border-red-300 text-red-800 line-through";
                                            }

                                            return `
                                                <div class="p-3 rounded-lg border text-sm flex items-center justify-between ${style}">
                                                    <span>${opt}</span>
                                                    <div class="flex items-center gap-1 text-xs">
                                                        ${isSelectedByUser ? '<span class="bg-slate-700 text-white px-2 py-0.5 rounded text-[10px]">내 선택</span>' : ''}
                                                        ${isTheRightAnswer ? '<span class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px]">정답</span>' : ''}
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>

                                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg text-sm text-slate-700 space-y-1">
                                        <div class="font-bold text-blue-800 flex items-center gap-1.5">
                                            <i data-lucide="book-open-check" class="w-4 h-4"></i> 정답 해설
                                        </div>
                                        <p class="leading-relaxed text-slate-600">${q.explanation}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </main>
                </div>
            `;
        }

        function toggleIncorrectFilter() {
            state.filterIncorrectOnly = !state.filterIncorrectOnly;
            render();
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
